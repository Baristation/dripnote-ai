services:
  ai-api:
    # 로컬 개발용 FastAPI 컨테이너입니다.
    build:
      context: .
      dockerfile: Dockerfile
    image: dripnote-ai:local
    env_file:
      # .env가 없어도 compose config/test를 볼 수 있게 optional로 둡니다.
      - path: .env
        required: false
    ports:
      - "8000:8000"
    depends_on:
      # Qdrant는 healthcheck 통과 후 앱을 띄웁니다.
      qdrant:
        condition: service_healthy
      # Redis는 LLM 세션/캐시/rate limit 용도로 앱과 같이 띄웁니다.
      redis:
        condition: service_started
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  qdrant:
    # RAG 상품 vector를 저장하는 로컬 Vector DB입니다.
    image: qdrant/qdrant:v1.12.4
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  redis:
    # AI 서버 전용 Redis입니다. 백엔드 인증용 Redis와 역할을 분리합니다.
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: ["redis-server", "--appendonly", "yes"]
    restart: unless-stopped

volumes:
  qdrant_data:
  redis_data:
