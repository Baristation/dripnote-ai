[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dripnote-ai"
version = "0.1.0"
description = "FastAPI + LangChain + LangGraph scaffold for backend orchestration, RAG, and fine-tuning."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.8.0",
  "pydantic-settings>=2.4.0",
  "langchain-core>=0.3.0,<0.4.0",
  "langchain>=0.3.0,<0.4.0",
  "langchain-openai>=0.3.35,<0.4.0",
  "langgraph>=1.0.0,<1.1.0",
  "qdrant-client>=1.12.0",
  "sqlalchemy>=2.0.0",
  "pymysql>=1.1.0",
  "cryptography>=42.0.0",
  "redis>=5.0.0",
  "tenacity>=8.5.0,<10.0.0",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "httpx>=0.27.0",
  "ruff>=0.6.0",
]
ml = [
  "sentence-transformers>=3.0.0",
  "datasets>=2.20.0",
  "transformers>=4.44.0",
  "accelerate>=0.34.0",
  "peft>=0.12.0",
  "trl>=0.10.0",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["apps*", "src*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
